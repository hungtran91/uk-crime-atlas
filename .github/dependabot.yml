# Weekly version updates, grouped, with small PR limits. Security updates are separate
# (enabled in repo settings) and are not limited by open-pull-requests-limit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    ignore:
      # @types/node follows the Node 24 engine
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # First match wins. next and eslint-config-next are exact pins that must stay equal.
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "react-is", "@types/react", "@types/react-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
